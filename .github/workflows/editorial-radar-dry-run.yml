name: Editorial Radar - Safe Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and RSS dependencies
        run: python -m pip install feedparser==6.0.11 Pillow==10.4.0

      - name: Run full test suite
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Run approved-source radar
        env:
          PYTHONPATH: .
        run: >-
          python live_source_radar.py
          --registry config/sources_v1.json
          --output artifacts/editorial-radar-candidates.json
          --report artifacts/editorial-radar-health.json

      - name: Upload radar evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: editorial-radar-dry-run
          path: |
            artifacts/editorial-radar-candidates.json
            artifacts/editorial-radar-health.json
          if-no-files-found: error
