name: Deploy Threads OAuth callback

on:
  push:
    branches:
      - agent/reactivate-threads-v1
      - main
    paths:
      - threads-auth/**
      - .github/workflows/threads-auth-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: threads-auth-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: threads-auth
      - name: Deploy callback
        id: deployment
        uses: actions/deploy-pages@v4
