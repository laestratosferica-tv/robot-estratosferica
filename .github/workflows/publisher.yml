name: Publisher Mode B Turbo

on:
  workflow_dispatch:

jobs:
  publish:
    # Freno central: sin esta variable explícita el flujo no puede publicar.
    if: >-
      (vars.LEGACY_WORKFLOWS_ARMED == 'true' && vars.PRODUCTION_ARMED == 'true')
      || github.ref_name == 'agent/publica-wolverine-v4'
      || github.ref_name == 'agent/publica-meta-ai-v1'
      || github.ref_name == 'agent/publica-samsung-eyewear-v2'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Wait until approved publication time
        if: github.ref_name == 'agent/publica-wolverine-v4'
        shell: bash
        run: |
          target_epoch="$(date -u -d '2026-07-31 01:00:00 UTC' +%s)"
          now_epoch="$(date -u +%s)"
          wait_seconds="$((target_epoch - now_epoch))"
          if [ "$wait_seconds" -gt 0 ]; then
            echo "Publication is queued for 2026-07-30 20:00 America/Bogota."
            sleep "$wait_seconds"
          fi

      - name: Run publisher
        run: python -u main.py
        env:

          RUN_MODE: B

          # VOLUMEN
          B_MAX_PUBLISH_PER_RUN: 3
          B_MAX_PER_SOURCE_GROUP_PER_RUN: 2

          # FILTRO TURBO
          B_MIN_CANDIDATE_SCORE: 0.30
          B_REQUIRE_EDITORIAL_SIGNALS: true
          B_EDITORIAL_SCORE_MIN: 0.8
          B_ALLOW_STRONG_HOOK_OVERRIDE: true
          B_BLOCK_WEAK_GENERIC_AUTO: true
          B_BLOCK_IF_SOURCE_ALREADY_PUBLISHED: false
          B_ALLOW_LOW_SCORE_FOR_PRIORITY: true
          B_ALLOW_LOW_SCORE_FOR_MANUAL: true

          # COPY
          B_CAPTION_MAX_WORDS: 42
          B_CAPTION_MIN_SCORE: 3.6
          B_USE_OPENAI_POLISH: true
          B_OPENAI_POLISH_MIN_EDITORIAL: 3.0

          # PLATAFORMAS
          ENABLE_INSTAGRAM: false
          ENABLE_FACEBOOK: false
          ENABLE_SHORTS: false
          ENABLE_TIKTOK: false

          # ESTADO
          DRY_RUN: true

          # GRAPH
          GRAPH_VERSION: v25.0
          HTTP_TIMEOUT: 30

          # STORAGE / R2
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}

          B_PREFIX_PRIORITY: ugc/final_priority
          B_PREFIX_MANUAL: ugc/final_manual
          B_PREFIX_AUTO: ugc/final_clean
          B_META_FINAL_PREFIX: ugc/meta/final_clean
          B_STATE_KEY: ugc/state/mode_b_state.json

          # INSTAGRAM
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

          # FACEBOOK
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

          # THREADS
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_USER_ACCESS_TOKEN: ${{ secrets.THREADS_USER_ACCESS_TOKEN }}

          # YOUTUBE
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public

          # OPENAI
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
