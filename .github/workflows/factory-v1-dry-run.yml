name: Factory V1 - Safe Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run safety tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Run five safe Phase 1 acceptance cycles
        env:
          PYTHONPATH: .
          THREADS_USER_ACCESS_TOKEN_CONFIGURED: ${{ secrets.THREADS_USER_ACCESS_TOKEN != '' }}
          THREADS_USER_ID_CONFIGURED: ${{ secrets.THREADS_USER_ID != '' }}
          IG_ACCESS_TOKEN_CONFIGURED: ${{ secrets.IG_ACCESS_TOKEN != '' }}
          IG_USER_ID_CONFIGURED: ${{ secrets.IG_USER_ID != '' }}
          FB_PAGE_ACCESS_TOKEN_CONFIGURED: ${{ secrets.FB_PAGE_ACCESS_TOKEN != '' }}
          FB_PAGE_ID_CONFIGURED: ${{ secrets.FB_PAGE_ID != '' }}
          YOUTUBE_CLIENT_ID_CONFIGURED: ${{ secrets.YOUTUBE_CLIENT_ID != '' }}
          YOUTUBE_CLIENT_SECRET_CONFIGURED: ${{ secrets.YOUTUBE_CLIENT_SECRET != '' }}
          YOUTUBE_REFRESH_TOKEN_CONFIGURED: ${{ secrets.YOUTUBE_REFRESH_TOKEN != '' }}
          R2_ENDPOINT_URL_CONFIGURED: ${{ secrets.R2_ENDPOINT_URL != '' }}
          AWS_ACCESS_KEY_ID_CONFIGURED: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          AWS_SECRET_ACCESS_KEY_CONFIGURED: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          BUCKET_NAME_CONFIGURED: ${{ secrets.BUCKET_NAME != '' }}
          GDRIVE_SERVICE_ACCOUNT_JSON_CONFIGURED: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON != '' }}
          GDRIVE_FOLDER_ID_CONFIGURED: ${{ secrets.GDRIVE_FOLDER_ID != '' }}
          OPENAI_API_KEY_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' }}
        run: python phase1_acceptance.py

      - name: Upload dry-run result
        uses: actions/upload-artifact@v4
        with:
          name: factory-v1-review-queue
          path: |
            artifacts/editorial_queue.json
            artifacts/operations-safety.json
            artifacts/platform-readiness.json
            artifacts/coordinator-health.json
            artifacts/phase1-acceptance.json
          if-no-files-found: error
