name: Build Wan Private Worker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wan-private-worker-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create large build volume
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c
        with:
          root-reserve-mb: 12288
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          build-mount-path: /var/lib/docker

      - name: Show build capacity
        run: |
          df -h
          docker system df

      - name: Reclaim runner disk
        run: |
          sudo apt-get clean
          docker system prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hardened worker
        uses: docker/build-push-action@v6
        with:
          context: wan/private_worker
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/wan-private-worker:wan22-a9247705c
            ghcr.io/${{ github.repository_owner }}/wan-private-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min,ignore-error=true

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## Wan private worker"
            echo
            echo "- Source: pinned public repositories"
            echo "- Target: ghcr.io/${{ github.repository_owner }}/wan-private-worker:${{ github.sha }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
