name: Build Wan Private Worker

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wan-private-worker-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The large-volume action already relocates Docker's data root.
          # Reuse that daemon instead of creating another BuildKit container.
          driver: docker

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hardened worker
        uses: docker/build-push-action@v6
        with:
          context: wan/private_worker
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/wan-private-worker:wan22-pinned
            ghcr.io/${{ github.repository_owner }}/wan-private-worker:${{ github.sha }}

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "## Wan private worker"
            echo
            echo "- Source: pinned public repositories"
            echo "- Target: ghcr.io/${{ github.repository_owner }}/wan-private-worker:${{ github.sha }}"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
