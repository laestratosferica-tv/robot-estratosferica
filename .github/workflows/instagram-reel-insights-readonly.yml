name: Instagram Reel Insights - Read Only

on:
  workflow_dispatch:
    inputs:
      permalink:
        description: "Enlace exacto del Reel"
        required: true
        type: string
      baseline_views:
        description: "Reproducciones de la línea base comparable"
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect read-only Reel insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_REEL_PERMALINK: ${{ inputs.permalink }}
          BASELINE_VIEWS: ${{ inputs.baseline_views }}
        run: python tools/collect_instagram_reel_insights.py

      - name: Upload redacted insights
        uses: actions/upload-artifact@v4
        with:
          name: instagram-reel-insights
          path: artifacts/instagram-reel-insights.json
          if-no-files-found: error
