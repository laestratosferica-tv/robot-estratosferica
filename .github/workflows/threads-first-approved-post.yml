name: Publish approved first Threads post

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/threads-first-approved-post.yml

permissions:
  contents: read

concurrency:
  group: threads-first-approved-post
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact approved text to Threads
    if: github.event_name == 'push' && github.run_attempt == 1 && github.event.head_commit.message == 'Publish approved first Threads post'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      THREADS_TOKEN: ${{ secrets.THREADS_USER_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      POST_TEXT: >-
        VALORANT abre una última puerta para Latinoamérica: el segundo sembrado regional disputará en São Paulo el LCQ de Game Changers Americas contra representantes de Brasil y Norteamérica. Serán dos días de LAN, el 14 y 15 de octubre, por el último cupo al Mundial. La señal es clara: LATAM vuelve a competir en una ruta continental real. ¿Qué equipo quieres ver allí?
    steps:
      - name: Validate configured Threads account
        shell: bash
        run: |
          set -euo pipefail
          test -n "$THREADS_TOKEN"
          test -n "$THREADS_USER_ID"
          HTTP_STATUS=$(curl --silent --show-error             --output /tmp/profile.json             --write-out "%{http_code}"             --get "https://graph.threads.net/me"             --data-urlencode "fields=id,username"             --data-urlencode "access_token=$THREADS_TOKEN")
          HTTP_STATUS="$HTTP_STATUS" python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("/tmp/profile.json").read_text())
          if int(os.environ["HTTP_STATUS"]) != 200:
              raise SystemExit("Threads profile validation failed")
          if str(payload.get("id", "")) != os.environ["THREADS_USER_ID"]:
              raise SystemExit("Configured token belongs to a different Threads account")
          if payload.get("username") != "laestratosfericatv":
              raise SystemExit("Unexpected Threads username")
          print("Validated @laestratosfericatv")
          PY

      - name: Create text container
        shell: bash
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl --silent --show-error             --output /tmp/container.json             --write-out "%{http_code}"             --request POST "https://graph.threads.net/$THREADS_USER_ID/threads"             --data-urlencode "media_type=TEXT"             --data-urlencode "text=$POST_TEXT"             --data-urlencode "access_token=$THREADS_TOKEN")
          HTTP_STATUS="$HTTP_STATUS" python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("/tmp/container.json").read_text())
          if int(os.environ["HTTP_STATUS"]) != 200 or not payload.get("id"):
              error = payload.get("error", {})
              print("Threads container error:", error.get("code", "unknown"), error.get("type", "unknown"))
              raise SystemExit(1)
          Path("/tmp/container-id").write_text(str(payload["id"]))
          print("Text container created")
          PY

      - name: Publish once
        shell: bash
        run: |
          set -euo pipefail
          CONTAINER_ID=$(cat /tmp/container-id)
          HTTP_STATUS=$(curl --silent --show-error             --output /tmp/published.json             --write-out "%{http_code}"             --request POST "https://graph.threads.net/$THREADS_USER_ID/threads_publish"             --data-urlencode "creation_id=$CONTAINER_ID"             --data-urlencode "access_token=$THREADS_TOKEN")
          HTTP_STATUS="$HTTP_STATUS" python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("/tmp/published.json").read_text())
          if int(os.environ["HTTP_STATUS"]) != 200 or not payload.get("id"):
              error = payload.get("error", {})
              print("Threads publish error:", error.get("code", "unknown"), error.get("type", "unknown"))
              raise SystemExit(1)
          Path("/tmp/post-id").write_text(str(payload["id"]))
          print("Post published once")
          PY

      - name: Verify and print permalink
        shell: bash
        run: |
          set -euo pipefail
          POST_ID=$(cat /tmp/post-id)
          for attempt in 1 2 3 4 5; do
            HTTP_STATUS=$(curl --silent --show-error               --output /tmp/post.json               --write-out "%{http_code}"               --get "https://graph.threads.net/$POST_ID"               --data-urlencode "fields=id,username,text,timestamp,permalink"               --data-urlencode "access_token=$THREADS_TOKEN")
            if HTTP_STATUS="$HTTP_STATUS" python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path("/tmp/post.json").read_text())
          expected = os.environ["POST_TEXT"]
          ok = (
              int(os.environ["HTTP_STATUS"]) == 200
              and payload.get("username") == "laestratosfericatv"
              and payload.get("text") == expected
              and bool(payload.get("permalink"))
          )
          if not ok:
              raise SystemExit(1)
          print("PERMALINK=" + payload["permalink"])
          PY
            then
              exit 0
            fi
            sleep 3
          done
          echo "Post was published but verification did not return a permalink"
          exit 1
