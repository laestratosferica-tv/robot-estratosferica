name: Threads Credential Check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Acción segura de credenciales"
        required: true
        type: choice
        default: validate_existing
        options:
          - validate_existing
          - prepare_rotation

permissions:
  contents: read

jobs:
  configuration:
    name: Verify OAuth configuration secrets
    if: inputs.mode == 'prepare_rotation'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check app secret without revealing it
        env:
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: |
          test -n "$THREADS_APP_SECRET" || {
            echo "THREADS_APP_SECRET is missing"
            exit 1
          }
          echo "Threads app secret is configured"

  exchange:
    name: Exchange OAuth code without publishing
    if: inputs.mode == 'prepare_rotation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      THREADS_APP_ID: "1418265033091931"
      THREADS_REDIRECT_URI: "https://estratosferica-threads-auth.joseluca83.chatgpt.site"
      THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
      THREADS_AUTH_CODE: ${{ secrets.THREADS_AUTH_CODE }}
      EXPECTED_THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - name: Check exchange secrets
        run: |
          test -n "$THREADS_APP_SECRET" || { echo "THREADS_APP_SECRET is missing"; exit 1; }
          test -n "$THREADS_AUTH_CODE" || { echo "THREADS_AUTH_CODE is missing"; exit 1; }
          test -n "$EXPECTED_THREADS_USER_ID" || { echo "THREADS_USER_ID is missing"; exit 1; }

      - name: Exchange authorization code for short-lived token
        run: |
          HTTP_STATUS=$(curl --silent --show-error             --output /tmp/threads-short.json             --write-out "%{http_code}"             --request POST "https://graph.threads.net/oauth/access_token"             --form-string "client_id=$THREADS_APP_ID"             --form-string "client_secret=$THREADS_APP_SECRET"             --form-string "grant_type=authorization_code"             --form-string "redirect_uri=$THREADS_REDIRECT_URI"             --form-string "code=$THREADS_AUTH_CODE")

          HTTP_STATUS="$HTTP_STATUS" python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = int(os.environ["HTTP_STATUS"])
          try:
              payload = json.loads(Path("/tmp/threads-short.json").read_text())
          except Exception:
              print(f"Meta returned an unreadable OAuth response (HTTP {status})")
              raise SystemExit(1)
          token = payload.get("access_token")
          if status != 200 or not token:
              error = payload.get("error", {})
              print(
                  "Meta rejected the authorization code:",
                  error.get("type", "unknown"),
                  error.get("code", "unknown"),
              )
              raise SystemExit(1)
          print(f"::add-mask::{token}")
          Path("/tmp/threads-short.token").write_text(token)
          print("Authorization code exchanged successfully")
          PY

      - name: Exchange for a 60-day token
        run: |
          SHORT_TOKEN=$(cat /tmp/threads-short.token)
          HTTP_STATUS=$(curl --silent --show-error             --output /tmp/threads-long.json             --write-out "%{http_code}"             --get "https://graph.threads.net/access_token"             --data-urlencode "grant_type=th_exchange_token"             --data-urlencode "client_secret=$THREADS_APP_SECRET"             --data-urlencode "access_token=$SHORT_TOKEN")

          HTTP_STATUS="$HTTP_STATUS" python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = int(os.environ["HTTP_STATUS"])
          try:
              payload = json.loads(Path("/tmp/threads-long.json").read_text())
          except Exception:
              print(f"Meta returned an unreadable long-token response (HTTP {status})")
              raise SystemExit(1)
          token = payload.get("access_token")
          if status != 200 or not token:
              error = payload.get("error", {})
              print(
                  "Meta rejected the long-token exchange:",
                  error.get("type", "unknown"),
                  error.get("code", "unknown"),
              )
              raise SystemExit(1)
          print(f"::add-mask::{token}")
          Path("/tmp/threads-long.token").write_text(token)
          Path("/tmp/threads-expires.txt").write_text(str(payload.get("expires_in", "")))
          print("Long-lived Threads token created")
          PY

      - name: Validate the new token with a read-only request
        run: |
          LONG_TOKEN=$(cat /tmp/threads-long.token)
          HTTP_STATUS=$(curl --silent --show-error             --output /tmp/threads-profile.json             --write-out "%{http_code}"             --get "https://graph.threads.net/me"             --data-urlencode "fields=id,username"             --data-urlencode "access_token=$LONG_TOKEN")

          HTTP_STATUS="$HTTP_STATUS" python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = int(os.environ["HTTP_STATUS"])
          try:
              payload = json.loads(Path("/tmp/threads-profile.json").read_text())
          except Exception:
              print(f"Threads returned an unreadable profile response (HTTP {status})")
              raise SystemExit(1)
          if status != 200 or not payload.get("id"):
              error = payload.get("error", {})
              print(
                  "Threads rejected the new token:",
                  error.get("type", "unknown"),
                  error.get("code", "unknown"),
              )
              raise SystemExit(1)
          expected = os.environ["EXPECTED_THREADS_USER_ID"]
          if str(payload["id"]) != expected:
              print("New token belongs to a different Threads account")
              raise SystemExit(1)
          metadata = {
              "id": str(payload["id"]),
              "username": payload.get("username", ""),
              "expires_in": Path("/tmp/threads-expires.txt").read_text(),
              "published": False,
          }
          Path("/tmp/threads-token-metadata.json").write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8",
          )
          print("New Threads token validated for the configured account")
          print("No content was created or published")
          PY

      - name: Encrypt token for secure handoff
        run: |
          cat > /tmp/threads-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAvCzApSzeUr4tse3DLWFd
          n6zDPudV5/spli37foxco7MN/x9OyTtHvEf7Tvv/OCP8xlgbfKkU9MCl/lFQV9UN
          8tP/+cOAHVWbJ6XgcUB7JMHDccbfbX3bFyY+1lYTgvTggotnCYt3pEoKdqHozVAF
          AVbJKvR0sQyxFjVERSHxRZztM2BeSXRh9ZcN30OdyXGCcvGSQIeEoCLsA05s5URU
          7GpjYGVED8/InqWZnuK02sRZ7hY5qojRr8iERD4S46LuNps2AKeX5OxqjSGqnAkJ
          Qa0oqnyzEURQS21uo+oke+nx3YuckqzZmAUohA8Hel1mjN4O9vMd+/b2tbwl0bZW
          11E5Mgo7YZgjTx9opTYVx3AEJ2Lo3rfe8214DR58vYV5nJ+A3DgBBDh59M2Q3g5q
          Q4BegxvfAMUDItos7PzND81rIdqWNSVXa92Dq1TCwU6BWWsF31z8B8usEaidLUds
          sVYYz/PuwdtQ8cZGE4idskXAsmSEPXvtVPYRc2vwKpE7AgMBAAE=
          -----END PUBLIC KEY-----
          EOF
          openssl pkeyutl -encrypt             -pubin -inkey /tmp/threads-public.pem             -in /tmp/threads-long.token             -out /tmp/threads-token.enc             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256
          shred -u /tmp/threads-short.token /tmp/threads-long.token
          echo "Token encrypted; plaintext was removed from the runner"

      - name: Upload encrypted handoff
        uses: actions/upload-artifact@v4
        with:
          name: threads-token-encrypted
          path: |
            /tmp/threads-token.enc
            /tmp/threads-token-metadata.json
          retention-days: 1
          if-no-files-found: error

  validate:
    name: Diagnose existing Threads token without publishing
    if: inputs.mode == 'validate_existing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check existing token secrets
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_USER_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          test -n "$THREADS_TOKEN" || {
            echo "THREADS_USER_ACCESS_TOKEN is missing"
            exit 1
          }
          test -n "$THREADS_USER_ID" || {
            echo "THREADS_USER_ID is missing"
            exit 1
          }

      - name: Validate token with read-only profile request
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_USER_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          HTTP_STATUS=$(curl --silent --show-error             --output /tmp/threads-profile.json             --write-out "%{http_code}"             --get "https://graph.threads.net/me"             --data-urlencode "fields=id,username"             --data-urlencode "access_token=$THREADS_TOKEN")

          HTTP_STATUS="$HTTP_STATUS" python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = int(os.environ["HTTP_STATUS"])
          raw = Path("/tmp/threads-profile.json").read_text(encoding="utf-8")
          if not raw.strip():
              print("Threads returned an empty response with HTTP status", status)
              raise SystemExit(1)
          payload = json.loads(raw)
          if status != 200:
              error = payload.get("error", {})
              print(
                  "Threads rejected the credential:",
                  error.get("type", "unknown"),
                  error.get("code", "unknown"),
                  error.get("message", "no message"),
              )
              raise SystemExit(1)

          returned_id = str(payload.get("id", ""))
          expected_id = os.environ["THREADS_USER_ID"]
          if not returned_id or returned_id != expected_id:
              print("Threads token is valid but the configured account ID differs")
              raise SystemExit(1)

          print("Threads credential is valid and belongs to the configured account")
          print("No content was created or published")
          PY

  approved_gaming_worlds_carousel:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3==1.34.162 requests==2.32.3
      - name: Publish the one approved 7-image carousel
        env:
          PRODUCTION_ARMED: "true"
          PUBLICATION_APPROVAL_ID: jose-luis-gaming-worlds-carousel-approved-2026-08-02
          GRAPH_VERSION: v25.0
          THREADS_GRAPH_VERSION: v1.0
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_USER_ACCESS_TOKEN: ${{ secrets.THREADS_USER_ACCESS_TOKEN }}
        run: >-
          python tools/publish_approved_carousel.py
          --manifest artifacts/publication-manifests/gaming-worlds-carousel-v3.json
          --live
          --output artifacts/gaming-worlds-carousel-publication-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaming-worlds-carousel-publication-result
          path: artifacts/gaming-worlds-carousel-publication-result.json
          if-no-files-found: warn

  diagnose_facebook_page_token:
    if: github.ref_name == 'agent/publish-gaming-worlds-carousel-run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Compare Facebook Graph versions without writing
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, requests
          token = os.environ['FB_PAGE_ACCESS_TOKEN']
          page = os.environ['FB_PAGE_ID']
          results = {}
          for version in ('v23.0', 'v25.0'):
              response = requests.get(
                  f'https://graph.facebook.com/{version}/{page}',
                  params={'fields': 'id,name,link'},
                  headers={'Authorization': f'Bearer {token}'}, timeout=30,
              )
              payload = response.json() if response.content else {}
              error = payload.get('error', {}) if isinstance(payload, dict) else {}
              results[version] = {
                  'http_status': response.status_code,
                  'id': payload.get('id') if isinstance(payload, dict) else None,
                  'name': payload.get('name') if isinstance(payload, dict) else None,
                  'error_type': error.get('type'),
                  'error_code': error.get('code'),
                  'error_subcode': error.get('error_subcode'),
                  'message': str(error.get('message', ''))[:250],
              }
          report = {'mode': 'facebook_token_version_readonly', 'results': results, 'secrets_exposed': False}
          open('facebook-token-diagnostic.json', 'w', encoding='utf-8').write(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: facebook-token-diagnostic
          path: facebook-token-diagnostic.json
