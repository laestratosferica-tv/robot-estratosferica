name: Monitor approved LCS CDMX piece

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monitor-threads-lcs-cdmx-approved.yml

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    if: github.event_name == 'push' && github.run_attempt == 1 && github.event.head_commit.message == 'Monitor approved LCS CDMX piece'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Wait and capture approved result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PUBLISH_SHA: a0a71b1515a383df0b39fe8e08d8d5244ba18c7d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for attempt in $(seq 1 60); do
            curl --silent --show-error --fail --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs?head_sha=$PUBLISH_SHA&event=push&per_page=20" --output /tmp/runs.json
            FOUND=$(python - <<'PY'
          import json
          from pathlib import Path
          runs = json.loads(Path("/tmp/runs.json").read_text()).get("workflow_runs", [])
          target = next((r for r in runs if r.get("name") == "Publish approved LCS CDMX piece"), None)
          if not target:
              print("MISSING")
          else:
              print("|".join([str(target.get("id", "")), str(target.get("status", "")), str(target.get("conclusion") or ""), str(target.get("html_url", ""))]))
          PY
            )
            if [ "$FOUND" = "MISSING" ]; then sleep 5; continue; fi
            IFS='|' read -r RUN_ID RUN_STATUS RUN_CONCLUSION RUN_URL <<< "$FOUND"
            if [ "$RUN_STATUS" != "completed" ]; then sleep 5; continue; fi
            PERMALINK=""
            curl --silent --show-error --fail --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/logs" --output /tmp/logs.zip || true
            if [ -s /tmp/logs.zip ]; then
              mkdir -p /tmp/logs
              unzip -oq /tmp/logs.zip -d /tmp/logs || true
              PERMALINK=$(grep -Rho 'PERMALINK=https://[^[:space:]]*' /tmp/logs 2>/dev/null | tail -n 1 | cut -d= -f2- || true)
            fi
            RUN_ID="$RUN_ID" RUN_STATUS="$RUN_STATUS" RUN_CONCLUSION="$RUN_CONCLUSION" RUN_URL="$RUN_URL" PERMALINK="$PERMALINK" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          result = {
              "workflow": "Publish approved LCS CDMX piece",
              "publish_commit": os.environ["PUBLISH_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "status": os.environ["RUN_STATUS"],
              "conclusion": os.environ["RUN_CONCLUSION"],
              "run_url": os.environ["RUN_URL"],
              "permalink": os.environ["PERMALINK"],
              "verified_permalink_in_logs": bool(os.environ["PERMALINK"]),
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("artifacts/threads-lcs-cdmx-approved-result.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
            break
          done
          test -f artifacts/threads-lcs-cdmx-approved-result.json
      - name: Record approved result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/threads-lcs-cdmx-approved-result.json
          git commit -m "Record approved LCS CDMX result"
          git push origin HEAD:main
