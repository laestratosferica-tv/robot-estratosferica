name: Sprint 3 - Epic Play Radar Read Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install metadata client
        run: python -m pip install requests==2.32.3

      - name: Run safety tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

      - name: Discover metadata through official APIs
        env:
          PYTHONPATH: .
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: >-
          python epic_play_radar.py
          --live
          --output artifacts/epic_play_candidates.json
          --report artifacts/epic-play-radar-report.json

      - name: Upload review queue
        uses: actions/upload-artifact@v4
        with:
          name: epic-play-radar-readonly
          path: |
            artifacts/epic_play_candidates.json
            artifacts/epic-play-radar-report.json
          if-no-files-found: error
